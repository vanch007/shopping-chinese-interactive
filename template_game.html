@media(max-width:360px){.brand small{display:none}.brand{font-size:.9rem}.wallet{font-size:.75rem}.page{padding:var(--s2)}.page-head{gap:var(--s2)}h2{font-size:1.3rem}.places .helper{display:none}.map-pin .pin-name{font-size:.63rem}.map-pin .pin{width:32px;height:32px}.tag{min-height:60px}.tag small{font-size:.68rem}}

<body>
<header class="app-header">
 <button class="brand" data-action="home" aria-label="一起逛街吧，回到地图">🛍️ 一起逛街吧 <small>新故事 2.0</small></button>
 <div class="header-tools"><span class="wallet" id="wallet"></span><button class="icon-btn" data-action="settings" aria-label="学习和语音设置">⚙</button></div>
</header>
<main id="app"></main>
<nav class="dock" aria-label="主要导航">
 <button data-action="map" id="nav-map"><span aria-hidden="true">⌘</span>街区地图</button>
 <button data-action="bag" id="nav-bag"><span aria-hidden="true">♧</span><b id="bag-label">购物袋</b></button>
 <button data-action="notes" id="nav-notes"><span aria-hidden="true">▤</span>学习笔记</button>
 <button data-action="topics" id="nav-topics"><span aria-hidden="true">☏</span>和朋友聊</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const VENUES=__VENUES_JSON__;
const STORY=__STORY_JSON__;
const IMAGES=__IMAGES_JSON__;
const AUDIO=__AUDIO_JSON__;
const STORAGE='shopping-story-v2';
const app=document.querySelector('#app');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({started:false,budget:STORY.budget,bag:[],talked:[],visited:[],learned:[],couponClaimed:false,couponUsed:false,finished:false,settings:{pinyin:true,vietnamese:true,autoplay:true,rate:1}});
let state=initial();
try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved&&Array.isArray(saved.bag)&&Number.isFinite(saved.budget)){state={...state,...saved,settings:{...state.settings,...saved.settings}}}}catch{}
let view={page:state.started?'map':'intro'};
let sequence=0,toastTimer;
const audio=new Audio();audio.preload='none';
let currentAudioKey=null;
const vocabByWord=new Map(STORY.vocab.map(v=>[v.word,v]));
const allItems=Object.values(VENUES).flatMap(v=>v.items.map(item=>({...item,venue:v.id})));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}}
function toast(message){const e=document.querySelector('#toast');e.textContent=message;e.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('visible'),2600)}
function stopAudio(){sequence++;audio.onended=null;audio.pause();currentAudioKey=null;syncPlayback()}
function syncPlayback(){document.querySelectorAll('[data-audio]').forEach(b=>{const active=b.dataset.audio===currentAudioKey&&!audio.paused;b.classList.toggle('playing',active);b.setAttribute('aria-pressed',String(active))})}
function play(key,options={}){
 if(!AUDIO[key]){toast('这段语音暂时无法播放');return Promise.resolve(false)}
 if(options.toggle&&currentAudioKey===key&&!audio.paused){stopAudio();return Promise.resolve(false)}
 sequence++;const token=sequence;audio.pause();audio.onended=null;currentAudioKey=key;audio.src=AUDIO[key];audio.playbackRate=state.settings.rate;
 audio.onended=()=>{currentAudioKey=null;syncPlayback();if(token===sequence&&options.onEnd)options.onEnd()};
 return audio.play().then(()=>{syncPlayback();return true}).catch(()=>{if(token===sequence){currentAudioKey=null;syncPlayback();toast('点一下播放按钮，就可以听了')}return false})
}
audio.addEventListener('error',()=>{currentAudioKey=null;syncPlayback();toast('语音播放失败，请再点一次')});
function sound(key,label='朗读'){return `<button class="sound" data-action="play" data-audio="${esc(key)}" aria-label="${esc(label)}" aria-pressed="false">♫</button>`}
function py(text){return text?`<p class="py" lang="zh-Latn">${esc(text)}</p>`:''}
function vi(text){return text?`<p class="vi" lang="vi">${esc(text)}</p>`:''}
function explanation(text){return `<details class="explanation"><summary>Giải thích · 越南语解释 ＋</summary><p lang="vi">${esc(text)}</p></details>`}
function backButton(page='map',venue=''){return `<button class="icon-btn" data-action="go" data-page="${page}" data-venue="${venue}" aria-label="返回">←</button>`}
function head(title,sub='',back='map',venue=''){return `<div class="page-head">${backButton(back,venue)}<div class="heading"><h2>${esc(title)}</h2>${vi(sub)}</div></div>`}
function tags(list){return `<div class="taglist">${list.map(t=>`<button class="tag" data-action="word" data-word="${esc(t.word)}"><strong>${esc(t.word)} ♫</strong><small class="py">${esc(t.py)}</small><small class="vi" lang="vi">${esc(t.vn)}</small></button>`).join('')}</div>`}
function navigate(next,replace=false){stopAudio();view={...next};if(replace)history.replaceState(view,'',location.href);else history.pushState(view,'',location.href);render();window.scrollTo({top:0,behavior:'instant'})}
function progress(){const n=Math.min(state.talked.length,3)+Math.min(state.bag.length,3);return `<div class="progress"><span class="progress-text">聊过 ${state.talked.length}/3 家店 · 买了 ${state.bag.length}/3 种商品</span><span class="progress-track" aria-label="任务进度 ${n}/6"><i style="width:${n/6*100}%"></i></span></div>`}
function tabbar(action,values,active){return `<div class="tabs">${values.map(([key,label])=>`<button data-action="${action}" data-mode="${key}" class="${key===active?'active':''}" aria-pressed="${key===active}">${label}</button>`).join('')}</div>`}
function changeView(changes){view={...view,...changes};history.replaceState(view,'',location.href);render()}
function pageControls(page,count,action='page'){return `<div class="pagination"><button class="btn" data-action="${action}" data-page-index="${page-1}" aria-label="上一页" ${page<=0?'disabled':''}>←</button><span>${page+1} / ${count}</span><button class="btn" data-action="${action}" data-page-index="${page+1}" aria-label="下一页" ${page>=count-1?'disabled':''}>→</button></div>`}
function intro(){return `<section class="page intro"><div class="intro-art"><img src="${IMAGES.map}" alt="新的购物街区，有七家店与一起逛街的朋友"></div><div class="intro-copy"><p class="eyebrow">第 6 课 · 购物 / MUA SẮM</p><h1>一起逛街吧。</h1><p class="zh">${esc(STORY.introZh)}</p>${vi(STORY.introVi)}<div class="intro-controls"><button class="btn primary" data-action="start">拿上购物袋，出发 →</button>${sound('sys_story','听故事开场')}</div><div class="intro-badges"><span class="badge">7 个地方</span><span class="badge">场景对话</span><span class="badge">中文 × Tiếng Việt</span></div></div></section>`}
function placeList(){return `<div class="places">${STORY.routeOrder.map(id=>{const v=VENUES[id];return `<button class="place" data-action="scene" data-venue="${id}"><span class="place-icon">${v.icon}</span><span class="grow"><strong>${esc(v.scene.shortName)} ${state.talked.includes(id)?'✓':''}</strong>${vi(v.scene.vn)}<span class="helper">${esc(v.scene.person)}</span></span></button>`}).join('')}</div>`}
function mapPage(){return `<section class="page"><div class="page-head"><div class="heading"><p class="eyebrow">周末的一天 / CUỐI TUẦN</p><h2>今天想去哪里？</h2></div><button class="btn" data-action="places">地点</button></div>${progress()}<div class="map-layout"><div class="world-wrap"><div class="world"><img src="${IMAGES.map}" alt="购物街区地图，点击店铺进入场景">${STORY.routeOrder.map(id=>{const p=STORY.mapPos[id],v=VENUES[id];return `<button class="map-pin ${state.talked.includes(id)?'done':''}" style="left:${p[0]}%;top:${p[1]}%" data-action="scene" data-venue="${id}" aria-label="进入${esc(v.scene.shortName)}，和${esc(v.scene.person)}聊天"><span class="pin">${state.talked.includes(id)?'✓':v.icon}</span><span class="pin-name">${esc(v.scene.shortName)}</span></button>`}).join('')}</div></div><aside class="map-aside"><div class="card"><p class="zh">先和店员聊聊，再挑喜欢的东西。</p>${vi('Trò chuyện với người bán trước, rồi chọn món mình thích.')}</div>${placeList()}${state.finished?`<button class="btn terra" data-action="finish">看看今天的收获 →</button>`:''}</aside></div></section>`}
function placesPage(){return `<section class="page">${head('选一个地方','Chọn địa điểm')}${placeList()}<div class="fill"></div><p class="helper">点地方进入，再点店员开始聊天。</p></section>`}
function scenePage(){const v=VENUES[view.venue];return `<section class="page">${head(v.scene.shortName,v.scene.vn)}<div class="scene-stage-wrap"><div class="scene-stage"><img src="${IMAGES[v.id]}" alt="${esc(v.scene.shortName)}的${esc(v.scene.person)}与${esc(v.items.map(i=>i.name).join('、'))}">${v.items.map((i,n)=>`<button class="hotspot" style="left:${i.pos.x}%;top:${i.pos.y}%" data-action="product" data-item="${i.id}" aria-label="查看${esc(i.name)}"><span class="dot">${n+1}</span></button>`).join('')}<div class="scene-bubble" data-action="talk" data-venue="${v.id}"><div class="scene-bubble-top"><span class="scene-bubble-name">${esc(v.scene.person)} · ${esc(v.scene.role)}</span><span class="scene-bubble-tag">正在说话 ♫</span></div><p class="zh">${esc(v.npc.text)}</p>${state.settings.vietnamese?`<p class="vi">${esc(v.npc.vn)}</p>`:''}<p class="scene-bubble-hint">点气泡开始回复 →</p></div></div></div><div class="scene-controls"><button class="btn primary" data-action="talk" data-venue="${v.id}">回应店员 (选回复 →)</button><button class="btn" data-action="shelf" data-venue="${v.id}">商品 (${v.items.length})</button><button class="btn" data-action="scene-words" data-venue="${v.id}">词语 ♫</button></div></section>`}
function shelfPage(){const v=VENUES[view.venue];return `<section class="page">${head('这里有什么？',v.scene.vn,'scene',v.id)}<div class="shelf">${v.items.map((i,n)=>`<button class="shelf-item" data-action="product" data-item="${i.id}"><span class="number">${n+1}</span><span class="grow"><strong>${esc(i.name)}</strong>${vi(i.vn)}</span><span class="price">${i.kind==='coupon'?'免费':'¥ '+i.price}${i.buyQuantity?' / 瓶':''}</span></button>`).join('')}</div><p class="helper">编号对应店里的物品，点商品可以认识生词。</p></section>`}
function sceneWordsPage(){const v=VENUES[view.venue];return `<section class="page scene-words-page">${head('在'+v.scene.shortName+'学词语',v.scene.vn,'scene',v.id)}<div class="row card"><div class="grow"><strong>${esc(v.scene.person)} · ${esc(v.scene.role)}</strong>${vi(v.scene.roleVi)}</div>${sound('sys_enter_'+v.id,'听场景介绍')}</div>${tags(v.scene.vocabTags)}<div class="fill"></div><p class="helper">点词语听发音，再看越南语与例子。</p><button class="btn primary" data-action="talk" data-venue="${v.id}">用中文和店员聊聊 →</button></section>`}
function phraseFor(venue,branch,who){const n=VENUES[venue].npc,c=n.choices[branch];if(who==='player')return {...c,audioKey:c.audioKey,name:'你 / Bạn'};if(who==='reply')return {zh:c.reply,py:c.replyPy,vn:c.replyVn,explanationVi:c.replyExplanationVi,audioKey:c.replyAudioKey,name:VENUES[venue].scene.person};return {zh:n.text,py:n.textPy,vn:n.vn,explanationVi:n.explanationVi,audioKey:n.audioKey,name:VENUES[venue].scene.person}}
function lineControls(phrase,who){return `<div class="line-controls">${sound(phrase.audioKey,'听'+phrase.name+'的语音')}${state.settings.vietnamese?`<button class="btn light" data-action="phrase-info" data-who="${who}" data-mode="explain">用法解析 ↗</button>`:''}<button class="btn" data-action="shelf" data-venue="${view.venue}">看商品 (${VENUES[view.venue].items.length})</button></div>`}
function dialoguePage(){const v=VENUES[view.venue],c=Number.isInteger(view.branch)?v.npc.choices[view.branch]:null,who=c?'reply':'opening',phrase=phraseFor(v.id,view.branch,who);return `<section class="page"><div class="page-head"><button class="icon-btn" data-action="scene" data-venue="${v.id}" aria-label="返回店里">←</button><div class="head-avatar-wrap"><img class="head-avatar" src="${IMAGES[v.id]}" alt="${esc(v.scene.person)}"></div><div class="heading"><h2 class="grow">和${esc(v.scene.person)}聊聊</h2><p class="vi">${esc(v.scene.role)} · ${esc(v.scene.vn)}</p></div>${sound(phrase.audioKey,'听语音')}</div><div class="dialogue-layout"><article class="card current-line"><div class="current-speech"><p class="zh">${esc(phrase.zh)}</p>${state.settings.vietnamese?`<p class="vi">${esc(phrase.vn)}</p>`:''}${state.settings.pinyin?`<p class="py">${esc(phrase.py)}</p>`:''}</div><div class="line-controls">${state.settings.vietnamese?`<button class="btn light" data-action="phrase-info" data-who="${who}" data-mode="explain">用法解析 ↗</button>`:''}<button class="btn" data-action="shelf" data-venue="${v.id}">看商品 (${v.items.length})</button></div></article>${!c?`<p class="dialogue-step">点句子接话 · ♫ 试听跟读 · 详 深入解析</p><div class="choices">${v.npc.choices.map((q,b)=>`<div class="choice"><button class="choice-main" data-action="choose" data-venue="${v.id}" data-branch="${b}"><p class="zh">${esc(q.zh)}</p>${state.settings.vietnamese?`<p class="vi">${esc(q.vn)}</p>`:''}</button><div class="choice-side"><button class="choice-sound" data-action="play-choice" data-audio="${q.audioKey}" aria-label="试听：${esc(q.zh)}">♫</button><button class="choice-info" data-action="choice-info" data-venue="${v.id}" data-branch="${b}" aria-label="详解：${esc(q.zh)}">详 ↗</button></div></div>`).join('')}</div>`:`<div class="chosen-line"><span class="grow">店员接着说 ↑</span><button class="btn" data-action="phrase-info" data-who="player" data-mode="zh">看看我的回复 ♫</button></div><div class="reply-actions"><button class="btn primary" data-action="product" data-item="${c.focusItem}">看看${esc(v.items.find(i=>i.id===c.focusItem).name)} →</button>${c.nextVenue?`<button class="btn terra" data-action="scene" data-venue="${c.nextVenue}">听了建议，去${esc(VENUES[c.nextVenue].scene.shortName)} ↗</button>`:''}<button class="btn" data-action="talk" data-venue="${v.id}">换个话题，继续聊</button></div>`}</div></section>`}
function itemById(id){return allItems.find(i=>i.id===id)}
function paidPrice(item){const base=item.price*(item.buyQuantity||1);return item.venue==='wangzhan'&&item.kind!=='coupon'&&state.couponClaimed&&!state.couponUsed?Math.max(0,base-25):base}
function productPage(){const i=itemById(view.item),v=VENUES[i.venue],tab=view.productTab||'item',owned=state.bag.find(b=>b.id===i.id),claimed=i.kind==='coupon'&&state.couponClaimed,price=owned?owned.paid:paidPrice(i),wordPer=Math.max(2,Math.min(6,Math.floor((app.clientHeight-280)/84)*2)),wordCount=Math.max(1,Math.ceil(i.vocabTags.length/wordPer)),wordPage=Math.min(view.pageIndex||0,wordCount-1);return `<section class="page product-page product-${tab}">${head(i.name,v.scene.shortName,'scene',v.id)}${tabbar('product-tab',[['item','看商品'],['words','学词语'],['sentence','说一句']],tab)}<div class="product-content">${tab==='item'?`<div class="product-art"><img src="${IMAGES[v.id]}" style="transform:translate(-${i.pos.x}%,-${i.pos.y}%)" alt="${esc(i.name)}在店里的陈列画面"></div><div class="product-top"><div class="grow">${py(i.pinyin)}${vi(i.vn)}${i.buyQuantity?`<p class="helper">每瓶 ¥${i.price} · 两瓶一起买</p>`:''}${price<i.price?`<p class="helper">优惠券减 ¥25 · 原价 ¥${i.price}</p>`:''}</div><strong class="price">${i.kind==='coupon'?'免费':'¥ '+price}</strong>${sound('prod_'+i.id,'听商品名称')}</div>`:tab==='words'?`<p class="helper">${esc(i.vocabCategory)}</p>${tags(i.vocabTags.slice(wordPage*wordPer,(wordPage+1)*wordPer))}<div class="fill"></div>${wordCount>1?pageControls(wordPage,wordCount):''}<button class="btn light" data-action="product-explain" data-item="${i.id}">越南语解释 · Giải thích →</button>`:`<div class="card sentence"><p class="zh">${esc(i.sentence)}</p><div class="line-controls">${sound(i.audioKey,'听商品例句')}<button class="btn" data-action="sentence-info" data-item="${i.id}" data-mode="py">拼音</button><button class="btn" data-action="sentence-info" data-item="${i.id}" data-mode="vi">越语</button><button class="btn" data-action="product-explain" data-item="${i.id}">解释</button></div></div>`}</div><div class="product-buy">${owned||claimed?`<span class="receipt">✓ ${claimed?'优惠券'+(state.couponUsed?'已使用':'待使用，网购减 ¥25'):'已放进购物袋 · ¥'+owned.paid}</span>`:`<button class="btn primary" data-action="buy" data-item="${i.id}" ${price>state.budget?'disabled':''}>${i.kind==='coupon'?'免费领取优惠券':price>state.budget?'余额不够':'买下 · ¥ '+price}</button>`}<button class="btn" data-action="talk" data-venue="${v.id}">问店员</button></div></section>`}
function amountPerPage(reserve,rowHeight,max=6){return Math.max(1,Math.min(max,Math.floor((app.clientHeight-reserve)/rowHeight)))}
function bagPage(){const per=amountPerPage(285,100),count=Math.max(1,Math.ceil(state.bag.length/per)),p=Math.min(view.pageIndex||0,count-1),list=state.bag.slice(p*per,(p+1)*per);return `<section class="page bag-page">${head('我们的购物袋','Túi mua sắm') }<div class="summary-stat"><div><strong>¥${STORY.budget-state.budget}</strong><small>已花费</small></div><div><strong>${state.bag.length}</strong><small>种商品</small></div><div><strong>¥${state.budget}</strong><small>剩余</small></div></div>${state.bag.length?`<div class="bag-list">${list.map(b=>{const i=itemById(b.id);return `<div class="list-row"><span>${i.icon}</span><div class="grow"><strong>${esc(i.name)}${b.quantity>1?' × '+b.quantity:''}</strong>${vi(i.vn)}</div><span class="price">¥${b.paid}</span>${sound('prod_'+i.id,'听'+i.name)}</div>`}).join('')}</div>${pageControls(p,count)}`:`<div class="empty"><h3>购物袋还是空的。</h3>${vi('Túi vẫn còn trống. Ghé một cửa hàng nhé.')}</div>`}<button class="btn ${state.finished?'terra':'primary'}" data-action="${state.finished?'finish':'map'}">${state.finished?'看看今天的收获 →':'继续逛街 →'}</button></section>`}
function notesPage(){const q=(view.query||'').toLocaleLowerCase(),list=STORY.vocab.filter(t=>[t.word,t.py,t.vn,t.exampleZh].join(' ').toLocaleLowerCase().includes(q)),per=amountPerPage(166,104,4)*(innerWidth>=720?2:1),count=Math.max(1,Math.ceil(list.length/per)),p=Math.min(view.pageIndex||0,count-1);return `<section class="page">${head('学习笔记','48 từ trong bài học')}<input class="search" id="word-search" type="search" value="${esc(view.query||'')}" placeholder="中文 / pinyin / tiếng Việt" aria-label="搜索词语"><div class="word-grid" id="word-grid">${list.slice(p*per,(p+1)*per).map(t=>`<article class="card word-card"><div class="grow"><strong>${esc(t.word)} ${state.learned.includes(t.word)?'✓':''}</strong>${py(t.py)}${vi(t.vn)}</div>${sound('vocab_'+t.word,'听'+t.word+'和例子')}<button class="btn" data-action="word" data-word="${esc(t.word)}" aria-label="查看${esc(t.word)}的解释与商品">译 ↗</button></article>`).join('')||'<p class="helper">没有找到，可以换个词试试。</p>'}</div>${pageControls(p,count)}</section>`}
function topicsPage(){const p=Math.min(view.pageIndex||0,STORY.topics.length-1),t=STORY.topics[p],mode=view.topicMode||'zh';return `<section class="page"><div class="page-head">${backButton()}<div class="heading"><h2>和朋友聊聊</h2><p class="helper">话题 ${p+1} · 轮流回答</p></div>${sound(t.audioKey,'听话题')}</div>${tabbar('topic-tab',[['zh','中文'],['py','拼音'],['vi','越语']],mode)}<div class="card reading"><p class="read-body ${mode==='zh'?'zh':mode==='py'?'py':'vi'}">${esc(mode==='zh'?t.zh:mode==='py'?t.py:t.vn)}</p></div>${pageControls(p,STORY.topics.length)}</section>`}
function splitReading(text){const h=Math.max(48,app.clientHeight-216),w=Math.min(app.clientWidth-64,680),budget=Math.max(40,Math.floor(w/10)*Math.floor(h/27));const weight=t=>[...t].reduce((n,c)=>n+(/[\u3400-\u9fff]/.test(c)?2:1),0);const pieces=text.match(/[^。！？.!?\n]+[。！？.!?]?|\n/g)||[text],out=[];let buf='';for(let piece of pieces){while(weight(piece)>budget){let cut=0,n=0;while(cut<piece.length&&n<budget){n+=/[\u3400-\u9fff]/.test(piece[cut])?2:1;cut++}if(buf){out.push(buf);buf=''}out.push(piece.slice(0,cut));piece=piece.slice(cut)}if(weight(buf+piece)>budget&&buf){out.push(buf);buf=''}buf+=piece}if(buf)out.push(buf);return out.length?out:['']}
function learnPage(){let content,title,footer='',audioKey,sourceType=view.kind; if(sourceType==='word'){const w=vocabByWord.get(view.word);content={zh:w.word,py:w.py,vn:w.vn,explanationVi:w.exampleVi,exampleZh:w.exampleZh,exampleVi:w.exampleVi};title=w.word+' · 场景生词';audioKey='vocab_'+w.word;const i=allItems.find(i=>i.vocabTags.some(t=>t.word===w.word)),v=Object.values(VENUES).find(v=>v.scene.vocabTags.some(t=>t.word===w.word));footer=i?`<button class="btn primary" data-action="product" data-item="${i.id}">看相关商品：${esc(i.name)} →</button>`:v?`<button class="btn primary" data-action="scene" data-venue="${v.id}">去${esc(v.scene.shortName)} →</button>`:'';} else if(sourceType==='product'||sourceType==='sentence'){const i=itemById(view.item);content={zh:i.sentence,py:i.sentencePy,vn:sourceType==='sentence'?i.sentenceVn:i.explanationVi,explanationVi:i.explanationVi};title=i.name+' · 重点句型';audioKey=i.audioKey;} else{content=phraseFor(view.venue,view.branch,view.who||'opening');title=sourceType==='choice'?'听懂，再接话':'这句话怎么用？';audioKey=content.audioKey;if(sourceType==='choice')footer=`<button class="btn primary" data-action="choose" data-venue="${view.venue}" data-branch="${view.branch}">用这句回复 →</button>`;} const matchedVocab=STORY.vocab.filter(w=>content.zh.includes(w.word)); return `<section class="page learn-page"><div class="page-head"><button class="icon-btn" data-action="learn-back" aria-label="返回">←</button><h2 class="grow">${esc(title)}</h2>${sound(audioKey,'听发音示范')}</div><div class="card learn-card"><div class="learn-hero-block"><p class="eyebrow">${sourceType==='choice'?'中文回复 · 跟读示范':sourceType==='word'?'核心词汇':'情境对话'}</p><div class="learn-zh">${esc(content.zh)}</div>${content.py?`<div class="learn-py">${esc(content.py)}</div>`:''}<div class="learn-sound-row"><button class="btn light" data-action="play-choice" data-audio="${audioKey}">♫ 点击试听跟读 (Nghe phát âm)</button></div></div><div class="learn-section"><span class="learn-label">越语翻译 · Bản dịch</span><div class="learn-vi-text">${esc(content.vn)}</div></div>${content.explanationVi?`<div class="learn-section"><span class="learn-label terra">用法解析 · Giải thích ngữ cảnh</span><div class="learn-explain-text">${esc(content.explanationVi)}</div></div>`:''}${matchedVocab.length?`<div class="learn-section"><span class="learn-label">重点词汇 · Từ vựng liên quan</span><div class="learn-vocab-tags">${matchedVocab.map(w=>`<span class="learn-vocab-tag">${esc(w.word)} · ${esc(w.py)} (${esc(w.vn)})</span>`).join('')}</div></div>`:''}${content.exampleZh?`<div class="learn-section"><span class="learn-label">例句示范 · Ví dụ thực tế</span><div class="learn-example"><div class="zh">${esc(content.exampleZh)}</div><div class="vi">${esc(content.exampleVi)}</div></div></div>`:''}</div><div class="read-footer">${footer||'<button class="btn primary" data-action="learn-back">看懂了，返回对话 →</button>'}</div></section>`};
function settingsPage(){const tab=view.settingsTab||'study';return `<section class="page">${head('学习与语音','Cài đặt')}${tabbar('settings-tab',[['study','学习与朗读'],['progress','屏幕与进度']],tab)}<div class="settings-content ${tab==='progress'?'progress-settings':''}">${tab==='study'?`<div class="card"><label class="setting"><span><strong>显示拼音</strong><p class="helper">Hiện pinyin</p></span><input type="checkbox" data-setting="pinyin" ${state.settings.pinyin?'checked':''}></label><label class="setting"><span><strong>越南语与解释</strong><p class="helper">Bản dịch và giải thích</p></span><input type="checkbox" data-setting="vietnamese" ${state.settings.vietnamese?'checked':''}></label><label class="setting"><span><strong>对话自动朗读</strong><p class="helper">Tự nghe lời thoại</p></span><input type="checkbox" data-setting="autoplay" ${state.settings.autoplay?'checked':''}></label><label class="setting"><strong>朗读速度</strong><select data-setting="rate"><option value="0.8" ${state.settings.rate===.8?'selected':''}>慢 · 0.8×</option><option value="1" ${state.settings.rate===1?'selected':''}>自然 · 1×</option><option value="1.15" ${state.settings.rate===1.15?'selected':''}>快 · 1.15×</option></select></label></div><div class="row card">${sound('npc_shichang','试听店员声音')}<span class="small grow">店员</span>${sound('choice_shangchang_0','试听回复声音')}<span class="small grow">你的回复</span></div><div class="fill"></div><p class="helper">点“越语 / 解释”理解台词，再回到对话接话。</p>`:`<button class="btn primary" data-action="fullscreen">全屏浏览</button><div class="card stack"><h3>重新开始</h3><p class="helper">清空本设备的购物与对话进度。</p><button class="btn" data-action="restart-preview">准备重新开始</button></div><div class="fill"></div><p class="version-note">新故事 2.0 · 单屏场景对话版<br>手机优先。Safari 可添加到主屏幕浏览。</p>`}</div></section>`}
function finishPage(){return `<section class="page finish-page"><div class="page-head">${backButton()}<h2 class="grow">逛街记录</h2>${sound('sys_finish','听今天的结尾')}</div><div class="summary-stat"><div><strong>${state.talked.length}</strong><small>位店员</small></div><div><strong>${state.bag.length}</strong><small>种商品</small></div><div><strong>${state.learned.length}</strong><small>个词语</small></div></div><div class="card finish-lines"><p class="eyebrow">${state.finished?'聚会准备好了！':'慢慢逛，慢慢聊。'}</p><h3>试着讲给朋友听</h3><p class="zh">我先去了……，然后去了……。</p><p class="zh">我买了……，因为……。</p><p class="zh">……虽然……，但是……。</p>${vi('Kể lại nơi đã đi, món đã mua và lý do.')}</div><div class="row"><button class="btn primary grow" data-action="topics">和朋友继续聊</button><button class="btn grow" data-action="map">再逛一会儿</button></div></section>`}
function render(){document.body.classList.toggle('no-py',!state.settings.pinyin);document.body.classList.toggle('no-vi',!state.settings.vietnamese);document.querySelector('#wallet').textContent='¥ '+state.budget;document.querySelector('#bag-label').textContent='购物袋'+(state.bag.length?' '+state.bag.length:'');const pages={intro,map:mapPage,places:placesPage,scene:scenePage,shelf:shelfPage,sceneWords:sceneWordsPage,dialogue:dialoguePage,product:productPage,bag:bagPage,notes:notesPage,topics:topicsPage,learn:learnPage,settings:settingsPage,finish:finishPage};if(!pages[view.page]||(view.venue&&!VENUES[view.venue])||(view.page==='product'&&!itemById(view.item)))view={page:'map'};app.innerHTML=pages[view.page]();for(const p of ['map','bag','notes','topics'])document.querySelector('#nav-'+p).classList.toggle('active',view.page===p||(p==='map'&&['intro','places','scene','shelf','sceneWords','dialogue','product'].includes(view.page)));syncPlayback();document.querySelectorAll('.world,.scene-stage').forEach(e=>{const p=e.parentElement,w=Math.min(p.clientWidth,p.clientHeight*2/3);e.style.width=w+'px';e.style.height=(w*1.5)+'px'})}
function checkGoal(){if(!state.finished&&state.talked.length>=3&&state.bag.length>=3){state.finished=true;toast('聚会准备好了！到购物袋看看今天的收获。')}save()}
function talk(venue){navigate({page:'dialogue',venue});play(VENUES[venue].npc.audioKey)}
function choose(venue,branch){const q=VENUES[venue].npc.choices[branch];if(!state.talked.includes(venue))state.talked.push(venue);checkGoal();navigate({page:'dialogue',venue,branch});if(state.settings.autoplay){const expected=view;play(q.audioKey,{onEnd:()=>{if(view===expected)play(q.replyAudioKey)}})}}
function buy(id){const i=itemById(id);if(i.kind==='coupon'){if(state.couponClaimed)return;state.couponClaimed=true;save();render();toast('优惠券已领取，下次网购减 ¥25');play('sys_buy_success');return}if(state.bag.some(b=>b.id===id))return;const price=paidPrice(i);if(price>state.budget){toast('余额不够，再看看其他商品');return}if(price<i.price)state.couponUsed=true;state.budget-=price;state.bag.push({id,paid:price,quantity:i.buyQuantity||1});checkGoal();render();toast(i.name+'放进购物袋了');play('sys_buy_success')}
document.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const a=button.dataset.action,d=button.dataset;
 if(a==='play'){if(d.audio.startsWith('vocab_')&&!state.learned.includes(d.audio.slice(6))){state.learned.push(d.audio.slice(6));save()}play(d.audio,{toggle:true});return}
 if(a==='start'){state.started=true;save();navigate({page:'map'});return}
 if(a==='home'||a==='map'){navigate({page:state.started?'map':'intro'});return}
 if(['bag','notes','topics','settings','finish','places'].includes(a)){navigate({page:a});return}
 if(a==='go'){navigate({page:d.page,venue:d.venue||undefined});return}
 if(a==='scene'){state.started=true;if(!state.visited.includes(d.venue))state.visited.push(d.venue);save();navigate({page:'scene',venue:d.venue});play(VENUES[d.venue].npc.audioKey);return}
 if(a==='play-choice'){play(d.audio,{toggle:true});return}
 if(a==='talk'){talk(d.venue);return}if(a==='choose'){choose(d.venue,Number(d.branch));return}
 if(a==='product'){navigate({page:'product',item:d.item});return}if(a==='product-tab'){changeView({productTab:d.mode,pageIndex:0});return}
 if(a==='shelf'){navigate({page:'shelf',venue:d.venue});return}if(a==='scene-words'){navigate({page:'sceneWords',venue:d.venue});return}
 if(a==='word'){if(!state.learned.includes(d.word)){state.learned.push(d.word);save()}navigate({page:'learn',kind:'word',word:d.word,mode:state.settings.vietnamese?'vi':'zh',from:{...view}});play('vocab_'+d.word);return}
 if(a==='choice-info'){const from={...view};navigate({page:'learn',kind:'choice',venue:d.venue,branch:Number(d.branch),who:'player',mode:state.settings.vietnamese?'vi':'zh',from});play(VENUES[d.venue].npc.choices[Number(d.branch)].audioKey);return}
 if(a==='phrase-info'){const from={...view};navigate({page:'learn',kind:'phrase',venue:view.venue,branch:view.branch,who:d.who,mode:d.mode,from});return}
 if(a==='sentence-info'){navigate({page:'learn',kind:'sentence',item:d.item,mode:d.mode,from:{...view}});return}
 if(a==='product-explain'){navigate({page:'learn',kind:'product',item:d.item,mode:'vi',from:{...view}});return}
 if(a==='learn-tab'){changeView({mode:d.mode,pageIndex:0});return}if(a==='learn-back'){navigate(view.from||{page:'map'},true);return}
 if(a==='page'){navigate({...view,pageIndex:Number(d.pageIndex)},true);return}if(a==='topic-tab'){changeView({topicMode:d.mode});return}if(a==='settings-tab'){changeView({settingsTab:d.mode});return}
 if(a==='buy'){buy(d.item);return}if(a==='fullscreen'){if(document.fullscreenElement)document.exitFullscreen?.();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>toast('可以在浏览器菜单里隐藏工具栏'));else toast('Safari 可以添加到主屏幕，获得更完整的画面');return}
 if(a==='restart-preview'){button.outerHTML='<button class="btn terra" data-action="restart">确认清空进度，重新开始</button>';return}if(a==='restart'){const settings=state.settings;state=initial();state.settings=settings;save();navigate({page:'intro'});return}
});
document.addEventListener('change',event=>{const key=event.target.dataset.setting;if(!key)return;state.settings[key]=key==='rate'?Number(event.target.value):event.target.checked;audio.playbackRate=state.settings.rate;save();render()});
document.addEventListener('input',event=>{if(event.target.id!=='word-search')return;const q=event.target.value,start=event.target.selectionStart;view={...view,query:q,pageIndex:0};history.replaceState(view,'',location.href);render();const input=document.querySelector('#word-search');input.focus();try{input.setSelectionRange(start,start)}catch{}});
window.addEventListener('popstate',event=>{stopAudio();view=event.state||{page:state.started?'map':'intro'};render()});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>render(),100)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio()});
history.replaceState(view,'',location.href);render();
</script>
</body>
